<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Faith Timothy</title>
  <meta name="theme-color" content="#000000" id="meta-theme-color">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
  <style>
    .error-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .error-card {
      max-width: 540px;
      width: 100%;
      padding: 48px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .error-code {
      font-size: 6rem;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
  </style>
</head>
<body>

  <!-- Ambient Background Container -->
  <div class="liquid-bg-container">
    <div class="liquid-orb orb-1"></div>
    <div class="liquid-orb orb-2"></div>
  </div>

  <main class="error-container">
    <div class="glass-panel glass-card error-card">
      <span class="error-code">404</span>
      <h1 style="font-size:1.8rem; font-weight:700;">Page Out of Orbit</h1>
      <p style="color:var(--text-muted); font-size:1rem; line-height:1.6;">
        The requested resource has shifted or doesn't exist. Let's get you back to safety.
      </p>
      <a href="index.html" class="btn-liquid btn-primary" style="margin-top:10px;">
        <i class="fa-solid fa-house" style="margin-right:8px;"></i>
        <span>Return to Homepage</span>
      </a>
    </div>
  </main>

  <script>
    document.documentElement.setAttribute('data-theme', 'dark');
  </script>
</body>
</html>
